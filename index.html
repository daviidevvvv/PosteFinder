  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS -->
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

        crossorigin=""/>

  <!-- Phosphor Icons -->

  <!-- Markdown Parser (Marked) for AI responses -->

  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #map { height: 100%; width: 100%; z-index: 0; }

    /* Custom scrollbar */
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .location-item.active {
      background-color: #eff6ff;
      border-color: #3b82f6;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .location-item.removed {
      opacity: 0.6;
      background-color: #f8fafc;
      border-color: #e2e8f0;
      order: 9999;
    }

    .filter-btn.active {
      background-color: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    /* Star Rating */
    .star-rating i {
      cursor: pointer;
      transition: color 0.2s;
    }
    .star-rating i:hover,
    .star-rating i.filled {
      color: #fbbf24;
      font-weight: bold;
    }

    /* Popup Styling */
    .leaflet-popup-content-wrapper { border-radius: 12px; padding: 0; overflow: hidden; }
    .leaflet-popup-content { margin: 12px; font-family: sans-serif; }

    /* AI Chat Widget */
    .chat-widget { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .chat-widget.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: all; }
    .chat-widget.closed { opacity: 0; transform: translateY(20px) scale(0.95); pointer-events: none; }

    .typing-dot { animation: typing 1.4s infinite ease-in-out both; }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typing {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    .ai-message p { margin-bottom: 0.5rem; }
    .ai-message p:last-child { margin-bottom: 0; }

    /* Status Badges */
    .status-badge { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; display: inline-flex; align-items: center; gap: 4px; }
    .status-open { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .status-closed { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .status-warning { background-color: #ffedd5; color: #9a3412; border: 1px solid #fed7aa; }

    /* Small optional controls; keep the existing map-left / sidebar-right layout. */
    .filter-open-now.active { background: #dcfce7; border-color: #86efac; color: #166534; }
  </style>
</head>

<body class="bg-slate-50 text-slate-900 h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="bg-yellow-400 p-4 shadow-md flex items-center justify-between z-20 shrink-0">
    <div>
      <h1 class="font-bold text-xl text-slate-900 flex items-center gap-2">
        <i class="ph-fill ph-package"></i> Punti Poste & Lis
      </h1>
      <p class="text-xs text-slate-800 font-medium opacity-80 pl-7">Trova, Valuta e Personalizza</p>
    </div>
    <button id="btn-locate" onclick="locateUser()"
            class="flex items-center gap-2 px-3 py-2 bg-white text-blue-600 rounded-full text-sm font-bold shadow-sm transition-all active:scale-95 hover:bg-blue-50">
      <i class="ph-bold ph-crosshair"></i>
      <span id="btn-locate-text">Trovami</span>
    </button>
  </header>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">

    <!-- Map Container -->
    <div class="flex-1 h-full relative z-0 order-2 md:order-1">
      <div id="map"></div>

      <!-- Reference Point Indicator (Floating) -->
      <div id="ref-point-indicator"
           class="hidden absolute top-4 left-1/2 transform -translate-x-1/2 bg-white/90 backdrop-blur px-4 py-2 rounded-full shadow-lg text-xs font-bold text-blue-800 z-[1000] border border-blue-200 flex items-center gap-2">
        <i class="ph-fill ph-ruler"></i>
        <span>Distanze da: <span id="ref-point-name">Casa</span></span>
        <button onclick="locateUser()"
                class="ml-2 w-5 h-5 rounded-full bg-slate-200 flex items-center justify-center hover:bg-red-100 hover:text-red-500">
          <i class="ph-bold ph-x"></i>
        </button>
      </div>

      <!-- AI Floating Action Button -->
      <button onclick="toggleChat()"
              class="absolute bottom-6 right-6 z-[1000] bg-indigo-600 hover:bg-indigo-700 text-white p-4 rounded-full shadow-xl flex items-center justify-center transition-all hover:scale-110 group">
        <i class="ph-fill ph-sparkle text-2xl group-hover:rotate-12 transition-transform"></i>
      </button>

      <!-- AI Chat Window -->
      <div id="chat-window"
           class="chat-widget closed absolute bottom-24 right-6 w-80 md:w-96 bg-white rounded-2xl shadow-2xl z-[1000] flex flex-col border border-slate-200 max-h-[60vh] md:max-h-[500px]">
        <!-- Chat Header -->
        <div class="bg-indigo-600 text-white p-4 rounded-t-2xl flex justify-between items-center">
          <div class="flex items-center gap-2">
            <i class="ph-fill ph-robot text-xl"></i>
            <div>
              <h3 class="font-bold text-sm">Assistente Postale ✨</h3>
              <p class="text-[10px] opacity-80">Powered by Gemini AI</p>
            </div>
          </div>
          <button onclick="toggleChat()" class="text-white hover:bg-indigo-500 rounded-full p-1 transition-colors">
            <i class="ph-bold ph-x"></i>
          </button>
        </div>

        <!-- Chat Messages -->
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50 custom-scroll text-sm">
          <div class="bg-indigo-50 text-indigo-900 p-3 rounded-2xl rounded-tl-none self-start max-w-[85%]">
            Ciao! 👋 Posso dirti quali punti pacchi/locker/uffici sono aperti ora. Chiedimi pure!
          </div>
        </div>

        <!-- Chat Input -->
        <div class="p-3 border-t border-slate-100 bg-white rounded-b-2xl">
          <div class="flex gap-2">
            <input type="text" id="chat-input" placeholder="Chiedi all'IA..."
                   class="flex-1 bg-slate-100 border-0 rounded-full px-4 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                   onkeypress="handleEnter(event)">
            <button onclick="sendMessage()"
                    class="bg-indigo-600 text-white w-9 h-9 rounded-full flex items-center justify-center hover:bg-indigo-700 transition-colors shadow-sm">
              <i class="ph-bold ph-paper-plane-right"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Sidebar List -->
    <div class="w-full md:w-96 bg-white flex flex-col shadow-2xl z-10 order-1 md:order-2 h-[50vh] md:h-auto border-t md:border-t-0 md:border-l border-slate-200">

      <!-- Add Place Section -->

        <div class="flex justify-between items-center mb-2">
          <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">I Miei Luoghi</span>

        </div>

        <!-- Form Aggiungi Luogo -->

          </div>
          <p id="search-error" class="text-[10px] text-red-500 mt-1 hidden">Indirizzo non trovato.</p>
        </div>

        <!-- Saved Places List -->
        <div id="custom-places-list" class="flex gap-2 overflow-x-auto pb-1"></div>
      </div>

      <!-- Filters -->
      <div class="p-3 bg-white border-b border-slate-200 shrink-0 space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Filtra</span>
          <div class="flex items-center gap-2">
            <button id="filter-open-now" type="button" aria-pressed="false" onclick="toggleOpenOnly()"

            </button>
            <button onclick="resetFlags()" class="text-[10px] text-gray-400 underline hover:text-red-500">Ripristina</button>
          </div>
        </div>

        <div class="relative">
          <i class="ph-bold ph-magnifying-glass absolute left-3 top-2.5 text-slate-400 pointer-events-none"></i>
          <input id="location-search" type="search" oninput="refreshView()" autocomplete="off"
                 aria-label="Cerca per nome o indirizzo" placeholder="Cerca punto o indirizzo..."
                 class="w-full rounded-lg border border-slate-200 bg-slate-50 py-2 pl-9 pr-3 text-xs focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>

        <div class="flex flex-wrap gap-2">
          <button onclick="setFilter('all')" id="filter-all"
                  class="filter-btn active flex-1 min-w-[45%] py-1.5 px-2 rounded-lg border border-slate-200 text-xs font-bold text-slate-600 bg-slate-50 transition-colors">
            Tutti
          </button>

          <button onclick="setFilter('poste')" id="filter-poste"
                  class="filter-btn flex-1 min-w-[45%] py-1.5 px-2 rounded-lg border border-slate-200 text-xs font-bold text-slate-600 bg-slate-50 transition-colors flex items-center justify-center gap-1">
            <i class="ph-fill ph-package"></i> Pacchi
          </button>

          <button onclick="setFilter('locker')" id="filter-locker"
                  class="filter-btn flex-1 min-w-[45%] py-1.5 px-2 rounded-lg border border-slate-200 text-xs font-bold text-slate-600 bg-slate-50 transition-colors flex items-center justify-center gap-1">
            <i class="ph-fill ph-lockers"></i> Locker
          </button>

          <button onclick="setFilter('uffici')" id="filter-uffici"
                  class="filter-btn flex-1 min-w-[45%] py-1.5 px-2 rounded-lg border border-slate-200 text-xs font-bold text-slate-600 bg-slate-50 transition-colors flex items-center justify-center gap-1">
            <i class="ph-fill ph-buildings"></i> Uffici
          </button>

          <button onclick="setFilter('fav')" id="filter-fav"
                  class="filter-btn flex-1 min-w-[45%] py-1.5 px-2 rounded-lg border border-slate-200 text-xs font-bold text-slate-600 bg-slate-50 transition-colors flex items-center justify-center gap-1">
            <i class="ph-fill ph-heart text-red-500"></i> Top
          </button>
        </div>
      </div>

        <span id="list-status" class="text-[10px] font-bold text-slate-500 uppercase">Elenco</span>

      </div>

    </div>
  </div>

    // GEOCODING (ROBUSTO) - sostituisce tutto il vecchio geocode

    const GEO_CACHE_KEY = "geocode_cache_v1";
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    function buildGeocodeCandidates(rawAddress) {
      const base = String(rawAddress || "").trim().replace(/\s+/g, " ");
      if (!base) return [];

      const variants = new Set([base]);

      // espansioni/contrazioni comuni: "Via G." <-> "Via Giorgio"
      variants.add(base.replace(/\bVia\s+G\.\s*/i, "Via Giorgio "));
      variants.add(base.replace(/\bVia\s+Giorgio\s+/i, "Via G. "));

      // se manca Bisceglie/Italia
      const list = [];
      for (const v of variants) {
        const hasCity = /bisceglie/i.test(v);
        const baseCity = hasCity ? v : `${v}, Bisceglie BT`;
        list.push(v);
        list.push(baseCity);
        list.push(`${baseCity}, Italia`);
      }

      // prova separazione via/numero/città
      for (const v of variants) {
        const m = v.match(/^(.*?)(\s+\d+[^\s,]*)\s*(?:,)?\s*(.*)$/);
        if (m) {
          const street = (m[1] || "").trim();
          const num = (m[2] || "").trim();
          const rest = (m[3] || "").trim();

          const cityPart = /bisceglie/i.test(rest) ? rest : (rest ? `${rest}, Bisceglie BT` : "Bisceglie BT");
          if (street && num) {
            list.push(`${street}, ${num}, ${cityPart}`);
            list.push(`${street}, ${num}, ${cityPart}, Italia`);
            list.push(`${street} ${num}, Bisceglie BT`);
            list.push(`${street} ${num}, Bisceglie BT, Italia`);
          }
        }
      }

      // fallback: togli civico
      for (const v of variants) {
        const noNum = v.replace(/\s+\d+.*$/,"").trim();
        if (noNum && noNum !== v) {
          list.push(`${noNum}, Bisceglie BT`);
          list.push(`${noNum}, Bisceglie BT, Italia`);
        }
      }

      // unici + puliti
      return [...new Set(list.map(s => String(s).trim()).filter(Boolean))];
    }

    async function geocodeOnce(query) {
      const cache = JSON.parse(localStorage.getItem(GEO_CACHE_KEY) || "{}");
      if (cache[query]) return cache[query];

      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`;
      const resp = await fetch(url, {
        headers: { "Accept":"application/json", "Accept-Language":"it" }
      });
      const data = await resp.json();

      if (data && data[0]) {
        const coords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
        cache[query] = coords;
        localStorage.setItem(GEO_CACHE_KEY, JSON.stringify(cache));
        return coords;
      }
      return null;
    }

    async function ensureCoordsForObject(obj) {
      if (obj.coords && Array.isArray(obj.coords) && obj.coords.length === 2) return obj.coords;

      const candidates = buildGeocodeCandidates(obj.address);
      for (const q of candidates) {
        const coords = await geocodeOnce(q);
        if (coords) { obj.coords = coords; return coords; }
        await sleep(120);
      }

      // fallback extra: se è "Casa" e non trovi nulla, usa HOME_FALLBACK_COORDS
      if (obj?.isDefault && String(obj?.name || '').toLowerCase() === 'casa') {
        obj.coords = HOME_FALLBACK_COORDS;
        return obj.coords;
      }

      return null;
    }

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([41.2405, 16.5040], 14);
      // Keep the same OpenStreetMap tiles by default, including all original markers.
      // If the primary tile endpoint is unavailable, retry with a second basemap.
      let failures = 0;
      let fallbackActive = false;
      const primaryTiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
      });
      primaryTiles.on('tileerror', () => {
        if (fallbackActive || ++failures < 4) return;
        fallbackActive = true;
        map.removeLayer(primaryTiles);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; OpenStreetMap contributors &copy; CARTO', maxZoom: 19
        }).addTo(map);
      });
      primaryTiles.addTo(map);

      // Prevent empty/partially drawn maps when returning to the tab or resizing.
      requestAnimationFrame(() => map.invalidateSize({ pan: false }));
      window.addEventListener('resize', () => map.invalidateSize({ pan: false }));
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) setTimeout(() => map.invalidateSize({ pan: false }), 80);
      });
    }

    function upsertDefaultPlacesIntoLocalStorage() {
      if (!Array.isArray(customPlaces)) customPlaces = [];

      const byId = new Map(customPlaces.map(p => [p.id, p]));
      const byAddr = new Map(customPlaces.map(p => [String(p.address || '').trim().toLowerCase(), p]));

      for (const d of DEFAULT_PLACES) {
        const addrKey = d.address.trim().toLowerCase();
        if (byId.has(d.id)) {
          const existing = byId.get(d.id);
          existing.isDefault = true;
          existing.name = d.name;
          // Never overwrite an address or location the user previously saved.
          if (!existing.address && d.address) existing.address = d.address;
          existing.icon = d.icon;
          if (!existing.coords && d.coords) existing.coords = d.coords;
          continue;
        }
        if (addrKey && byAddr.has(addrKey)) {
          const existing = byAddr.get(addrKey);
          existing.isDefault = true;
          existing.name = existing.name || d.name;
          existing.icon = existing.icon || d.icon;
          if (d.coords && !existing.coords) existing.coords = d.coords;
          continue;
        }
        customPlaces.push({ id: d.id, isDefault: true, name: d.name, address: d.address, icon: d.icon, coords: d.coords || null });
      }

      localStorage.setItem('custom_places', JSON.stringify(customPlaces));
    }

    // ============================================================
    // TIME LOGIC (Daily schedule)
    // ============================================================
    const DAY_KEYS = ['sun','mon','tue','wed','thu','fri','sat'];

    function normalizeSchedule(schedule) {
      if (!schedule) return null;
      if (schedule.mon || schedule.tue || schedule.wed || schedule.thu || schedule.fri || schedule.sat || schedule.sun) return schedule;
      if (schedule.am) {
        const dayIntervals = [];
        dayIntervals.push(schedule.am);
        if (schedule.pm) dayIntervals.push(schedule.pm);
        return { mon:dayIntervals, tue:dayIntervals, wed:dayIntervals, thu:dayIntervals, fri:dayIntervals, sat:dayIntervals, sun:[] };
      }
      return null;
    }

    function getOpeningStatus(scheduleRaw) {
      const schedule = normalizeSchedule(scheduleRaw);
      if (!schedule) return { isOpen:false, text:"Orari sconosciuti", class:"status-closed", score:-1 };

      const now = new Date();
      const currentMins = now.getHours()*60 + now.getMinutes();
      const dayKey = DAY_KEYS[now.getDay()];
      const intervals = schedule[dayKey] || [];
      if (!intervals.length) return { isOpen:false, text:"Chiuso", class:"status-closed", score:0 };

      const toMin = (h,m) => h*60 + m;

      for (const it of intervals) {
        const start = toMin(it[0], it[1]);
        const end   = toMin(it[2], it[3]);
        if (currentMins >= start && currentMins < end) {
          const diff = end - currentMins;
          if (diff <= 30) return { isOpen:true, text:`Chiude tra ${diff} min`, class:"status-warning", score:2 };
          return { isOpen:true, text:"Aperto", class:"status-open", score:3 };
        }
      }

      const upcoming = intervals.map(it => toMin(it[0], it[1])).filter(s => s > currentMins).sort((a,b)=>a-b)[0];
      if (upcoming && (upcoming-currentMins) <= 30) {
        return { isOpen:false, text:`Apre tra ${upcoming-currentMins} min`, class:"status-warning", score:1 };
      }
      return { isOpen:false, text:"Chiuso", class:"status-closed", score:0 };
    }

    function checkFilter(loc) {
      if (currentFilter === 'all') return true;

      if (currentFilter === 'poste') {
        return loc.hasPoste ||
               loc.kind === 'locker_punto_poste' ||
               loc.kind === 'locker_inpost' ||
               loc.kind === 'locker_amazon' ||

      if (currentFilter === 'locker') {
        return loc.kind === 'locker_punto_poste' || loc.kind === 'locker_inpost' || loc.kind === 'locker_amazon';
      }

      if (currentFilter === 'uffici') return loc.kind === 'ufficio_postale';
      if (currentFilter === 'fav') return favorites.includes(loc.id);
      return true;
    }

    // ============================================================
    // MARKER JITTER
    // ============================================================
    function jitterIfDuplicate(coords, seen, step=0.00008) {
      const key = coords.map(x => x.toFixed(5)).join(',');
      const count = (seen[key] || 0);
      seen[key] = count + 1;
      if (count === 0) return coords;
      const angle = (count * 70) * Math.PI/180;
      return [coords[0] + Math.cos(angle)*step, coords[1] + Math.sin(angle)*step];
    }

      const searchTerm = (document.getElementById('location-search')?.value || '')
        .trim().toLocaleLowerCase('it');
      if (searchTerm) {
        visibleData = visibleData.filter(loc => [loc.realName, loc.originalName, loc.address, loc.services]
          .filter(Boolean).join(' ').toLocaleLowerCase('it').includes(searchTerm));
      }
      if (openOnly) visibleData = visibleData.filter(loc => loc.currentStatus.isOpen);

      visibleData.sort((a,b) => {
        const aFav = favorites.includes(a.id);
        const bFav = favorites.includes(b.id);
        if (aFav && !bFav) return -1;
        if (!aFav && bFav) return 1;

        if (b.currentStatus.score !== a.currentStatus.score) return b.currentStatus.score - a.currentStatus.score;

        const aRemoved = removedIds.includes(a.id);
        const bRemoved = removedIds.includes(b.id);
        if (aRemoved && !bRemoved) return 1;
        if (!aRemoved && bRemoved) return -1;

        if (referencePoint && a.coords && b.coords) {
          const distA = getDistance(referencePoint[0], referencePoint[1], a.coords[0], a.coords[1]);
          const distB = getDistance(referencePoint[0], referencePoint[1], b.coords[0], b.coords[1]);
          return distA - distB;
        }
        return 0;
      });

      updateMarkers(visibleData);
      renderList(visibleData);
    }

    // ============================================================
    // UPDATE MARKERS
    // ============================================================
    function pickIcon(loc) {
      if (loc.kind === 'ufficio_postale') return Icons.posteOffice;
      if (loc.kind === 'locker_punto_poste') return Icons.posteLocker;
      if (loc.kind === 'locker_inpost') return Icons.inpostLocker;
      if (loc.kind === 'locker_amazon') return Icons.amazonLocker;
      if (loc.kind === 'amazon_counter') return Icons.amazonCounter;

      let icon = loc.hasPoste ? Icons.gold : Icons.blue;
      if (favorites.includes(loc.id)) icon = Icons.red;
      return icon;
    }

    function updateMarkers(data) {
      Object.values(storeMarkers).forEach(marker => map.removeLayer(marker));
      storeMarkers = {};

      const seen = {};

      data.forEach(loc => {
        if (removedIds.includes(loc.id)) return;
        if (!loc.coords || !Array.isArray(loc.coords) || loc.coords.length !== 2) return;

        const opacity = loc.currentStatus.isOpen ? 1 : 0.55;
        const icon = pickIcon(loc);

        const coords = jitterIfDuplicate([...loc.coords], seen);
        const marker = L.marker(coords, { icon, opacity }).addTo(map);

        const userRate = ratings[loc.id] || 0;
        let starsHtml = '';
        for (let i=1;i<=5;i++) starsHtml += i <= userRate ? '★' : '☆';

        marker.bindPopup(`
          <div class="p-1 min-w-[170px]">
            <h3 class="font-bold text-sm">${escapeHtml(loc.realName)}</h3>
            <div class="mb-1"><span class="${loc.currentStatus.class} status-badge">${escapeHtml(loc.currentStatus.text)}</span></div>
            <div class="text-yellow-500 text-xs mb-1">${starsHtml}</div>
            <p class="text-xs text-gray-600 truncate">${escapeHtml(loc.address)}</p>
            <button onclick="selectLocation(${loc.id})" class="mt-2 w-full bg-blue-600 text-white text-xs py-1 rounded">Dettagli</button>
          </div>
        `);

        marker.on('click', () => selectLocation(loc.id));
        storeMarkers[loc.id] = marker;
      });
    }

    // ============================================================
    // RENDER LIST
    // ============================================================
    function renderList(data) {
      const container = document.getElementById('locations-list');
      document.getElementById('count-display').innerText = data.filter(d => !removedIds.includes(d.id)).length;
      container.innerHTML = '';

      data.forEach(loc => {
        const isRemoved = removedIds.includes(loc.id);
        const isSelected = selectedId === loc.id;
        const isFav = favorites.includes(loc.id);
        const userRate = ratings[loc.id] || 0;
        const status = loc.currentStatus;

        let distText = '';
        if (referencePoint && loc.coords) {
          const d = getDistance(referencePoint[0], referencePoint[1], loc.coords[0], loc.coords[1]);
          distText = d < 1000 ? `${Math.round(d)}m` : `${(d/1000).toFixed(1)}km`;
        }

        const item = document.createElement('div');
        item.id = `loc-${loc.id}`;
        item.className = `location-item p-3 rounded-xl border transition-all cursor-pointer relative mb-2
          ${isRemoved ? 'removed' : ''}
          ${status.isOpen ? '' : 'opacity-80 bg-slate-50'}
          ${isSelected ? 'active' : 'bg-white border-slate-100 hover:border-slate-300 hover:bg-slate-50'}`;

        if (!isRemoved) item.onclick = () => selectLocation(loc.id);

        let starsHtml = '';
        for (let i=1; i<=5; i++) {
          const fillClass = i <= userRate ? 'ph-fill text-yellow-400' : 'ph-bold text-gray-300';
          starsHtml += `<i class="${fillClass} ph-star" onclick="setRating(${loc.id}, ${i}, event)"></i>`;
        }

        item.innerHTML = `
          <div class="flex justify-between items-start mb-1">
            <div class="flex-1 pr-2">
              <div class="flex items-center gap-1">
                <h3 class="font-bold text-sm leading-tight ${isSelected ? 'text-blue-800' : (isRemoved ? 'text-gray-400 line-through' : 'text-slate-800')}">
                  ${escapeHtml(loc.realName)}
                </h3>
                ${isFav ? '<i class="ph-fill ph-heart text-red-500 text-xs"></i>' : ''}
              </div>
              <div class="mt-1">
                <span class="${status.class} status-badge">${escapeHtml(status.text)}</span>
                ${isRemoved ? '<span class="text-[10px] text-red-500 font-bold ml-1">NON ATTIVO</span>' : ''}
              </div>
            </div>
            ${distText && !isRemoved ? `<div class="text-xs font-bold bg-slate-200 text-slate-700 px-2 py-1 rounded-md shrink-0">${escapeHtml(distText)}</div>` : ''}
          </div>

          <div class="flex flex-col gap-0.5 text-xs text-slate-500 mb-2">
            <div class="flex items-start gap-1.5">
              <i class="ph-fill ph-map-pin mt-0.5 shrink-0"></i>
              <span class="leading-tight truncate">${escapeHtml(loc.address)}</span>
            </div>
          </div>

          <div class="flex items-center justify-between mt-2">
            <div class="star-rating flex text-sm gap-0.5">${starsHtml}</div>
            <button onclick="toggleFavorite(${loc.id}, event)"
              class="p-1.5 rounded-full hover:bg-red-50 transition-colors ${isFav ? 'text-red-500' : 'text-gray-300 hover:text-red-400'}">
              <i class="${isFav ? 'ph-fill' : 'ph-bold'} ph-heart text-lg"></i>
            </button>
          </div>

          <div class="flex flex-wrap gap-2 text-[10px] font-medium mt-2 pt-2 border-t border-slate-100">
            ${loc.kind === 'ufficio_postale' ? '<span class="text-slate-700 bg-slate-100 px-1.5 py-0.5 rounded">Ufficio</span>' : ''}
            ${loc.kind === 'locker_punto_poste' ? '<span class="text-indigo-700 bg-indigo-50 px-1.5 py-0.5 rounded">Locker Poste</span>' : ''}
            ${loc.kind === 'locker_inpost' ? '<span class="text-green-700 bg-green-50 px-1.5 py-0.5 rounded">Locker InPost</span>' : ''}
            ${loc.kind === 'locker_amazon' ? '<span class="text-orange-700 bg-orange-50 px-1.5 py-0.5 rounded">Amazon Locker</span>' : ''}
            ${loc.kind === 'amazon_counter' ? '<span class="text-orange-700 bg-orange-50 px-1.5 py-0.5 rounded">Amazon Counter</span>' : ''}
            ${loc.hasPoste && loc.kind === 'punto' ? '<span class="text-yellow-700 bg-yellow-50 px-1.5 py-0.5 rounded">Poste</span>' : ''}
            ${loc.hasLis ? '<span class="text-blue-700 bg-blue-50 px-1.5 py-0.5 rounded">Lis</span>' : ''}
          </div>

          ${isSelected && !isRemoved ? `
            <div class="flex gap-2 mt-3 pt-2 border-t border-blue-100">
              <button onclick="event.stopPropagation(); openGoogleMapsById(${loc.id})"
                class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-xs py-2 px-4 rounded-lg font-semibold flex items-center justify-center gap-2 transition-colors shadow-sm">
                <i class="ph-bold ph-navigation-arrow"></i> Vai
              </button>
              <button onclick="toggleFlag(${loc.id}, event)"
                class="px-3 bg-white border border-slate-200 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg flex items-center justify-center transition-colors" title="Segnala non attivo">
                <i class="ph-bold ph-flag"></i>
              </button>
            </div>
          ` : ''}

          ${isRemoved ? `<button onclick="toggleFlag(${loc.id}, event)" class="w-full text-center text-[10px] text-blue-500 underline mt-1">Annulla segnalazione</button>` : ''}
        `;

        container.appendChild(item);
      });
    }

    // ============================================================
    // GEO / UTILS
    // ============================================================
    function locateUser() {
      const btnText = document.getElementById('btn-locate-text');
      btnText.innerText = "Cerco...";
      document.getElementById('ref-point-indicator').classList.add('hidden');
      if (!navigator.geolocation) {
        btnText.innerText = 'Trovami';
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude } = pos.coords;
          userPosition = [latitude, longitude];
          referencePoint = userPosition;

          if (userMarker) map.removeLayer(userMarker);
          userMarker = L.marker(userPosition, { icon: Icons.red }).addTo(map).bindPopup("<b>Tu sei qui</b>").openPopup();
          map.setView(userPosition, 15);

          btnText.innerText = "Trovami";
          refreshView();
          document.getElementById('list-status').innerText = "Vicino a te";
        },
        (err) => {
          console.error(err);
          btnText.innerText = "Trovami";
          if (!referencePoint) {
            const home = customPlaces.find(x => x.isDefault && x.name === 'Casa' && x.coords);
            if (home?.coords) setReferencePoint(home.coords, home.name);
          }
        }
      );
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI/180, φ2 = lat2 * Math.PI/180;
      const Δφ = (lat2-lat1) * Math.PI/180, Δλ = (lon2-lon1) * Math.PI/180;
      const a = Math.sin(Δφ/2)*Math.sin(Δφ/2) + Math.cos(φ1)*Math.cos(φ2) * Math.sin(Δλ/2)*Math.sin(Δλ/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    async function selectLocation(id) {
      if (removedIds.includes(id)) return;
      selectedId = id;

      const loc = LOCATIONS_DATA.find(l => l.id === id);
      if (!loc) return;

      if (!loc.coords) await ensureCoordsForObject(loc);
      if (loc.coords) map.flyTo(loc.coords, 17);

      refreshView();
      // refreshView rebuilds the markers: open the *new* one, not the old one.
      if (loc.coords && storeMarkers[id]) storeMarkers[id].openPopup();
      setTimeout(() => {
        const el = document.getElementById(`loc-${id}`);
        if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
      }, 50);
    }

    function openGoogleMapsById(id) {
      const loc = LOCATIONS_DATA.find(item => item.id === id);
      if (loc) openGoogleMaps(loc.address);
    }

    function openGoogleMaps(address) {
      window.open(`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(address)}`, '_blank');
    }

    function escapeHtml(s) {
      if (s === null || s === undefined) return '';
      return String(s)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }
    function escapeAttr(s) {
      return escapeHtml(s).replaceAll('\n',' ').replaceAll('\r',' ');
    }

    // ============================================================
    // CUSTOM PLACES
    // ============================================================
    function toggleAddPlaceForm() {
      document.getElementById('add-place-form').classList.toggle('hidden');
    }

    async function searchAndAddPlace() {
      const name = document.getElementById('new-place-name').value || "Luogo";
      let address = document.getElementById('new-place-address').value;
      if (!address) return;
      if (!address.toLowerCase().includes("bisceglie")) address += ", Bisceglie";

      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(address)}`);
        const data = await response.json();
        if (data && data[0]) {
          const coords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
          customPlaces.push({ id: Date.now(), name, coords, address, isDefault:false });
          localStorage.setItem('custom_places', JSON.stringify(customPlaces));
          renderCustomPlaces();
          toggleAddPlaceForm();
          setReferencePoint(coords, name);
        } else {
          document.getElementById('search-error').classList.remove('hidden');
        }
      } catch (e) { console.error(e); }
    }

    function deleteCustomPlace(id) {
      const p = customPlaces.find(x => x.id === id);
      if (p?.isDefault) return;
      if(confirm("Eliminare?")) {
        customPlaces = customPlaces.filter(p => p.id !== id);
        localStorage.setItem('custom_places', JSON.stringify(customPlaces));
        if(customPlaceMarkers[id]) { map.removeLayer(customPlaceMarkers[id]); delete customPlaceMarkers[id]; }
        renderCustomPlaces();
      }
    }

    function renderCustomPlaces() {
      const list = document.getElementById('custom-places-list');
      list.innerHTML = '';

      // markers
      customPlaces.forEach(place => {
        if (!place.coords || !Array.isArray(place.coords) || place.coords.length !== 2) return;
        if (!customPlaceMarkers[place.id]) {
          const marker = L.marker(place.coords, { icon: Icons.green }).addTo(map);
          marker.bindPopup(`<b>${escapeHtml(place.name)}</b><br>${escapeHtml(place.address)}`);
          marker.on('click', () => setReferencePoint(place.coords, place.name));
          customPlaceMarkers[place.id] = marker;
        } else {
          customPlaceMarkers[place.id].setPopupContent(`<b>${escapeHtml(place.name)}</b><br>${escapeHtml(place.address)}`);
        }
      });

      // pills
      const sortedPlaces = [...customPlaces].sort((a,b) => {
        const aD = a.isDefault ? 0 : 1;
        const bD = b.isDefault ? 0 : 1;
        if (aD !== bD) return aD - bD;
        return String(a.name).localeCompare(String(b.name));
      });

      sortedPlaces.forEach(place => {
        const pill = document.createElement('div');
        pill.className = "flex items-center gap-1 bg-green-50 border border-green-200 rounded-full px-2 py-1 cursor-pointer hover:bg-green-100 shrink-0";
        const icon = place.icon || "ph-map-pin";

        pill.innerHTML = `
          <i class="ph-fill ${escapeHtml(icon)} text-green-700 text-xs"></i>
          <span class="text-xs font-bold text-green-900">${escapeHtml(place.name)}</span>
          ${place.isDefault
            ? '<i class="ph-bold ph-pencil-simple text-[10px] text-green-500 hover:text-blue-600 ml-1" title="Imposta o modifica indirizzo"></i>'
            : '<i class="ph-bold ph-x text-[10px] text-green-400 hover:text-red-500 ml-1"></i>'}
        `;

        pill.querySelector('span').addEventListener('click', async () => {
          if (place.coords && Array.isArray(place.coords) && place.coords.length === 2) {
            setReferencePoint(place.coords, place.name);
          } else {
            await configureReferencePlace(place);
          }
        });

        const edit = pill.querySelector('.ph-pencil-simple');
        if (edit) edit.addEventListener('click', (ev) => {
          ev.stopPropagation();
          configureReferencePlace(place, true);
        });

        const x = pill.querySelector('.ph-x');
        if (x) x.addEventListener('click', (ev) => { ev.stopPropagation(); deleteCustomPlace(place.id); });

        list.appendChild(pill);
      });
    }

    async function configureReferencePlace(place, forceEdit = false) {
      const previousAddress = place.address || '';
      const previousCoords = place.coords;
      if (forceEdit || !previousAddress || !Array.isArray(previousCoords)) {
        const entered = prompt(`Inserisci l'indirizzo per ${place.name} (salvato solo in questo browser):`, previousAddress);
        if (!entered || !entered.trim()) return;
        place.address = entered.trim();
        place.coords = null;
      }
      try {
        await ensureCoordsForObject(place);
      } catch (error) {
        console.error('Ricerca indirizzo non riuscita', error);
      }
      if (!place.coords) {
        place.address = previousAddress;
        place.coords = previousCoords;
        alert('Indirizzo non trovato. Controlla la connessione e riprova.');
        return;
      }
      localStorage.setItem('custom_places', JSON.stringify(customPlaces));
      if (customPlaceMarkers[place.id]) {
        map.removeLayer(customPlaceMarkers[place.id]);
        delete customPlaceMarkers[place.id];
      }
      renderCustomPlaces();
      setReferencePoint(place.coords, place.name);
    }

    function setReferencePoint(coords, name) {
      referencePoint = coords;
      refreshView();
      document.getElementById('ref-point-indicator').classList.remove('hidden');
      document.getElementById('ref-point-name').innerText = name;
      map.panTo(coords);
    }

    // ============================================================
    // FAVORITES / RATINGS / FLAGS
    // ============================================================
    function toggleFavorite(id, event) {
      if (event) event.stopPropagation();
      if (favorites.includes(id)) favorites = favorites.filter(fid => fid !== id);
      else favorites.push(id);
      localStorage.setItem('user_favorites', JSON.stringify(favorites));
      refreshView();
    }

    function setRating(id, rating, event) {
      if (event) event.stopPropagation();
      ratings[id] = rating;
      localStorage.setItem('user_ratings', JSON.stringify(ratings));
      refreshView();
    }

    function toggleFlag(id, event) {
      if (event) event.stopPropagation();
      if (removedIds.includes(id)) removedIds = removedIds.filter(itemId => itemId !== id);
      else removedIds.push(id);
      localStorage.setItem('removed_locations', JSON.stringify(removedIds));
      refreshView();
    }

    function resetFlags() {
      if(confirm("Ripristinare tutti?")) {
        removedIds = [];
        localStorage.setItem('removed_locations', '[]');
        refreshView();
      }
    }

    // ============================================================
    // GEMINI AI CHAT
    // ============================================================
    function toggleChat() {
      const chatWindow = document.getElementById('chat-window');
      if (chatWindow.classList.contains('closed')) {
        chatWindow.classList.remove('closed');
        chatWindow.classList.add('open');
        document.getElementById('chat-input').focus();
      } else {
        chatWindow.classList.remove('open');
        chatWindow.classList.add('closed');
      }
    }

    function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }

    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const message = input.value.trim();
      if (!message) return;

      let keyToUse = userApiKey;
      if (!keyToUse) {
        const manualKey = prompt("Incolla la tua Gemini API Key:");
        if (manualKey) {
          userApiKey = manualKey;
          localStorage.setItem('gemini_api_key', manualKey);
          keyToUse = manualKey;
        } else return;
      }

      addMessage(message, 'user');
      input.value = '';
      const loadingId = addLoadingMessage();

      try {
        const activeLocations = LOCATIONS_DATA
          .filter(l => !removedIds.includes(l.id))
          .map(l => {
            const status = getOpeningStatus(l.schedule);
            return { name:l.realName, status:status.text, type:l.kind, services:l.services, address:l.address };
          });

        const systemPrompt = `
Sei "Assistente Postale".
Rispondi in italiano, breve, con emoji.
LISTA PUNTI + STATO: ${JSON.stringify(activeLocations)}.
        `.trim();

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${keyToUse}`, {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({
            contents:[{ parts:[{ text: message }] }],
            systemInstruction:{ parts:[{ text: systemPrompt }] }
          })
        });

        const data = await response.json();
        const loadingEl = document.getElementById(loadingId);
        if (loadingEl) loadingEl.remove();

        if (data.candidates?.[0]?.content) {
          addMessage(data.candidates[0].content.parts[0].text, 'ai');
        } else {
          addMessage("Errore tecnico.", 'ai');
        }
      } catch (e) {
        const loadingEl = document.getElementById(loadingId);
        if (loadingEl) loadingEl.remove();
        addMessage("Errore connessione.", 'ai');
      }
    }

    function addMessage(text, sender) {
      const container = document.getElementById('chat-messages');
      const div = document.createElement('div');

      if (sender === 'user') {
        div.className = "bg-white text-slate-800 p-3 rounded-2xl rounded-tr-none self-end max-w-[85%] border border-slate-200 shadow-sm";
        div.innerText = text;
      } else {
        div.className = "ai-message bg-indigo-50 text-indigo-900 p-3 rounded-2xl rounded-tl-none self-start max-w-[85%]";
        div.innerHTML = marked.parse(text);
      }

      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function addLoadingMessage() {
      const container = document.getElementById('chat-messages');
      const id = 'loading-' + Date.now();
      const div = document.createElement('div');
      div.id = id;
      div.className = "bg-indigo-50 p-4 rounded-2xl rounded-tl-none self-start flex gap-1 items-center";
      div.innerHTML = `<div class="typing-dot w-2 h-2 bg-indigo-400 rounded-full"></div>
                       <div class="typing-dot w-2 h-2 bg-indigo-400 rounded-full"></div>
                       <div class="typing-dot w-2 h-2 bg-indigo-400 rounded-full"></div>`;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      return id;
    }
  </script>
