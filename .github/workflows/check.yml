name: Verify PosteFinder
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and JavaScript
        run: node scripts/check-source.mjs && node --check src/firebase-sync.mjs && node --check src/state-schema.mjs
      - name: Unit tests
        run: node --test
      - name: Verify importable directory without writing to Firebase
        run: node scripts/seed-firestore.mjs
